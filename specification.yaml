specification:
  id: "SPEC-IMPORT-USERID-001"
  name: "批量导入支持 userId（CSV + JSON）"
  version: "1.0.0"
  issue: "#219"
  created_at: "2026-10-30T02:25:31Z"
  source: "docs/plans/2026-10-29-issue-219-csv-userid-import-design.md (v2, R2 APPROVED 100%)"
  previous_spec_archive: ".sprint-state/archive/specification-issue-149-prisma7.yaml"
  requirements:
    - id: REQ-USERID-001
      description: |
        CSV 导入识别 userId 列（别名 userid/用户id/钉钉id/user_id/dingtalkid，大小写不敏感），
        有 userId 的行按 userId 模式导入、跳过钉钉手机号反查；仅当既无手机号列又无 userId 列时拒绝。
      priority: MUST
      acceptance_criteria:
        - id: AC-USERID-001-01
          given: "上传仅含 userId,姓名 两列的 CSV"
          when: "调用 POST /api/plans/:id/import-preview"
          then: "不抛缺列错误；每行进入分类；有 userId 的行 status=ok 且 userId 与输入一致"
        - id: AC-USERID-001-02
          given: "上传 手机号,姓名,userId 三列、手机号列留空但 userId 有值的 CSV"
          when: "调用 import-preview"
          then: "该行不被丢弃，按 userId 模式分类（不调用手机号反查）"
        - id: AC-USERID-001-03
          given: "CSV 表头既无手机号列也无 userId 列"
          when: "调用 import-preview"
          then: "返回 400，错误信息包含「必须包含手机号或 userId 列之一」"
      edge_cases:
        - "全表所有行都缺手机号与 userId → 400 且信息明确指出缺少两者"
        - "部分行缺标识 → 200，逐行 status=missing_identifier"
      test_coverage_requirements:
        unit: true
        integration: true
        e2e: false

    - id: REQ-USERID-002
      description: |
        姓名校验按模式分流：userId 模式下姓名与钉钉真名不一致 → 状态 name_differs 但可导入（DR-001）；
        姓名反查因配额/权限/网络失败 → 仍可导入并在 message 标注「姓名未校验」（DR-002）；
        钉钉明确返回用户不存在 → 状态 user_not_found 不可导入。手机号模式 name_mismatch 语义不变（不可导入）。
      priority: MUST
      acceptance_criteria:
        - id: AC-USERID-002-01
          given: "userId 行姓名与钉钉真名不一致"
          when: "import-preview"
          then: "status=name_differs 且该行计入 passed（可导入），message 明示仅提示"
        - id: AC-USERID-002-02
          given: "userId 行姓名反查抛配额/网络错误"
          when: "import-preview"
          then: "status=ok，message 含「姓名未校验」，并记录 warn 日志"
        - id: AC-USERID-002-03
          given: "手机号行姓名与钉钉真名不一致"
          when: "import-preview"
          then: "status=name_mismatch 且不可导入（与现状一致）"
        - id: AC-USERID-002-04
          given: "userId 行填了姓名，但钉钉 user/get 返回成功却不带姓名（空串或 undefined）"
          when: "import-preview"
          then: "不得报告为已验证；status=ok 且 message 含「姓名未校验」（DR-002 降级放行），因为实际未发生任何姓名比对"
      edge_cases:
        - "userId 行未填姓名 → 不发起反查，直接 ok"
        - "userId 行姓名反查返回用户不存在 → user_not_found，不可导入"
      test_coverage_requirements:
        unit: true
        integration: true
        e2e: false

    - id: REQ-USERID-003
      description: |
        可导入性为 status 的纯函数（IMPORTABLE_STATUSES={ok,name_differs}），预览计数与 commit 校验共用同一白名单；
        预览响应计数自洽：warnings ⊆ passed，passed + failed === totalRows。
      priority: MUST
      acceptance_criteria:
        - id: AC-USERID-003-01
          given: "混合结果（ok / name_differs / name_mismatch）"
          when: "import-preview"
          then: "passed 含 name_differs；warnings <= passed；passed + failed === totalRows"
        - id: AC-USERID-003-02
          given: "commit 请求携带 status=name_mismatch 的行"
          when: "POST import-commit"
          then: "返回 400（非可导入状态被拒）"
      edge_cases:
        - "客户端试图用附加字段伪造可导入性 → 服务端仅凭 status 判定，不受影响"
      test_coverage_requirements:
        unit: true
        integration: true
        e2e: false

    - id: REQ-USERID-004
      description: |
        commit 契约放宽且向后兼容：phone 改为可选（纯 userId 行），status 接受 ok|name_differs，userId 保持必填。
      priority: MUST
      acceptance_criteria:
        - id: AC-USERID-004-01
          given: "commit 行无 phone 字段、status=ok、userId 有值"
          when: "POST import-commit"
          then: "200，成功创建访谈记录"
        - id: AC-USERID-004-02
          given: "旧客户端提交带 phone 的 status=ok 行"
          when: "POST import-commit"
          then: "200，行为与改动前一致"
        - id: AC-USERID-004-03
          given: "commit 行 status=name_differs、无 phone"
          when: "POST import-commit"
          then: "200，成功创建访谈记录"
      test_coverage_requirements:
        unit: false
        integration: true
        e2e: false

    - id: REQ-USERID-005
      description: |
        JSON 批量导入：[{userId, name}]（兼容键名 用户id/姓名）上传到同一 import-preview 端点，
        复用同一行模型与分类/提交管线。结构错误（非法 JSON / 非数组）返回 400；语义错误（元素缺字段）逐行展示不阻断。
      priority: MUST
      acceptance_criteria:
        - id: AC-USERID-005-01
          given: "上传 application/json 的 [{userId,name}]"
          when: "import-preview"
          then: "结果与等价 CSV 一致，且可 import-commit"
        - id: AC-USERID-005-02
          given: "上传语法非法的 JSON 或非数组 JSON"
          when: "import-preview"
          then: "返回 400，信息说明 JSON 解析失败/必须为数组"
        - id: AC-USERID-005-03
          given: "JSON 数组含缺字段元素与有效元素混合"
          when: "import-preview"
          then: "返回 200，缺字段元素逐行 status=missing_identifier，有效元素正常分类"
      test_coverage_requirements:
        unit: true
        integration: true
        e2e: false

    - id: REQ-USERID-006
      description: |
        UI 文案与预览/提交行为一致：上传提示列出实际支持的列头（含 userId）与 JSON 支持，
        accept 接受 .csv/.json，预览计数与提交过滤与后端可导入性一致。
      priority: SHOULD
      acceptance_criteria:
        - id: AC-USERID-006-01
          given: "管理员打开访谈计划详情页的 CSV 导入弹窗"
          when: "查看上传提示与文件选择器"
          then: "提示含 userId 与 JSON，accept 含 .json"
        - id: AC-USERID-006-02
          given: "预览含 name_differs 行"
          when: "点击确认导入"
          then: "该行被提交（不被 'ok'-only 过滤丢弃）"
      test_coverage_requirements:
        unit: true
        integration: false
        e2e: true
