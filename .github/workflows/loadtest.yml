# Loadtest baseline against REAL PostgreSQL (issue #180, DR-002).
#
# Non-gating by design: runs on demand and monthly to (a) collect the real
# connection-pool numbers that the local PGlite baseline cannot measure and
# (b) provide a cross-version capacity regression series. Never blocks PRs.
name: Loadtest Baseline (real PostgreSQL)

on:
  workflow_dispatch:
  schedule:
    # Monthly, 1st day 03:00 UTC.
    - cron: '0 3 1 * *'

jobs:
  loadtest:
    name: Loadtest (real PostgreSQL, non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dialog_survey
          POSTGRES_PASSWORD: loadtest
          POSTGRES_DB: dialog_survey
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dialog_survey -d dialog_survey"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://dialog_survey:loadtest@127.0.0.1:5432/dialog_survey
      LOADTEST_USE_REAL_PG: '1'
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply schema to real PostgreSQL
        run: npx prisma db push --skip-generate

      - name: Run loadtest (S1-S6, real pool)
        run: npm run loadtest

      # Commit the real-PG results JSON back to the repo so the cross-version
      # capacity regression series survives artifact expiry (90 days). The
      # pattern is gitignored (local runs must not dirty the tree), hence -f.
      - name: Commit results to docs/reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f docs/reports/loadtest-results-*.json
          if git diff --cached --quiet; then
            echo "No new results to commit"
            exit 0
          fi
          git commit -m "chore(loadtest): record real-PG baseline results [skip ci]"
          git push

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: loadtest-results
          path: docs/reports/loadtest-results-*.json
          retention-days: 90
