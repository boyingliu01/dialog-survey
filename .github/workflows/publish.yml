name: Publish to npm

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write

    steps:

      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      # npm >= 11.5.1 is required for Trusted Publishing (OIDC); Node 20/22
      # bundle npm 10.x, which fails with ENEEDAUTH because it cannot exchange
      # the GitHub Actions OIDC token for an ephemeral publish token.
      # Pinned to ^11: npm 12.x dropped Node 20 support (EBADENGINE).
      - name: Upgrade npm for Trusted Publishing (OIDC)
        run: npm install -g npm@^11.5.1

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Install Playwright for PDF export tests
        run: npx playwright install --with-deps chromium

      - name: Run tests
        run: npm run test:coverage
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
      - name: Build
        run: npm run build

      - name: Dry-run npm pack
        run: npm pack --dry-run

      - name: Publish to npm
        run: npm publish --provenance --access public --registry https://registry.npmjs.org
