name: PR Quality Gates

on:
  pull_request:
    branches: [master, main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-analysis:
    name: Static Analysis (Biome + tsc + ast-grep)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Biome check
        run: npx biome check src/

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: ast-grep lint (no raw Prisma in API, advisory only)
        run: npx --package=@ast-grep/cli sg scan --rule tools/.ast-grep/rules/no-raw-prisma-in-api.yml || true

  unit-tests:
    name: Unit Tests (mock, PrismaClient init needs DB)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Install Playwright for PDF export tests
        run: npx playwright install --with-deps chromium

      - name: Run unit tests
        run: npx vitest run --exclude '**/*.integration.test.ts' --exclude 'tests/e2e/**'
        env:
          NODE_ENV: test
          DINGTALK_CLIENT_ID: ${{ secrets.DINGTALK_CLIENT_ID || 'dummy-ci-client-id' }}
          DINGTALK_CLIENT_SECRET: ${{ secrets.DINGTALK_CLIENT_SECRET || 'dummy-ci-client-secret' }}

  integration-tests:
    name: Integration Tests (real PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Install Playwright for PDF export tests
        run: npx playwright install --with-deps chromium

      - name: Run integration tests
        run: npx vitest run tests/*.integration.test.ts
        env:
          NODE_ENV: test
          LLM_API_KEY: ${{ secrets.LLM_API_KEY || '' }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL || '' }}
          LLM_MODEL: ${{ secrets.LLM_MODEL || '' }}
          DINGTALK_CLIENT_ID: ${{ secrets.DINGTALK_CLIENT_ID || 'dummy-ci-client-id' }}
          DINGTALK_CLIENT_SECRET: ${{ secrets.DINGTALK_CLIENT_SECRET || 'dummy-ci-client-secret' }}

  security-scan:
    name: Security Scan (semgrep + gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: semgrep SAST scan
        continue-on-error: true
        uses: semgrep/semgrep-action@v1
        with:
          config: auto
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN || '' }}

      - name: gitleaks secret scan
        continue-on-error: true
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  coverage:
    name: Coverage Check (80/80/70/80)
    if: always()
    needs: [unit-tests, integration-tests]
    # Run regardless of integration test failures (known pre-existing data residue issue)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Install Playwright for PDF export tests
        run: npx playwright install --with-deps chromium

      - name: Run all tests with coverage
        run: npx vitest --coverage
        env:
          NODE_ENV: test
          LLM_API_KEY: ${{ secrets.LLM_API_KEY || '' }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL || '' }}
          LLM_MODEL: ${{ secrets.LLM_MODEL || '' }}
          DINGTALK_CLIENT_ID: ${{ secrets.DINGTALK_CLIENT_ID || 'dummy-ci-client-id' }}
          DINGTALK_CLIENT_SECRET: ${{ secrets.DINGTALK_CLIENT_SECRET || 'dummy-ci-client-secret' }}
          # Coverage thresholds are enforced by vitest.config.ts

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  e2e-tests:
    name: E2E Tests (Playwright, PGlite)
    if: always()
    needs: [static-analysis, unit-tests, integration-tests, security-scan]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Install Playwright
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npx vitest run tests/e2e/*.e2e.test.ts --reporter=verbose --test-timeout=30000
        env:
          NODE_ENV: test
          LLM_API_KEY: ${{ secrets.LLM_API_KEY || '' }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL || '' }}
          LLM_MODEL: ${{ secrets.LLM_MODEL || '' }}
          DINGTALK_CLIENT_ID: ${{ secrets.DINGTALK_CLIENT_ID || 'dummy-ci-client-id' }}
          DINGTALK_CLIENT_SECRET: ${{ secrets.DINGTALK_CLIENT_SECRET || 'dummy-ci-client-secret' }}

  smoke:
    name: Smoke Test
    if: always()
    needs: [static-analysis, unit-tests, integration-tests, security-scan]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run smoke test
        run: npm run smoke

  # Enforces Conventional Commits (issue #153, design doc §5). The repo
  # squash-merges, so the PR title becomes the final commit message on master —
  # that check is load-bearing, the branch-range check is advisory only.
  commit-lint:
    name: Commit Lint (Conventional Commits)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # fetch-depth: 0 — without full history `origin/<base>` does not exist and
      # the range check would silently lint nothing (§5.1).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      # Prerequisite: every `npx --no-install` below resolves offline from here.
      - name: Install dependencies (pinned, no registry drift)
        run: npm ci

      # Self-check (§5.4): a known-bad message MUST be rejected. If commitlint is
      # missing, npx is unavailable, or the config is emptied, this step fails
      # first — the gate can never silently fail-open.
      - name: Self-check (lint command actually rejects bad input)
        run: |
          set -euo pipefail
          # Must fail: non-conventional message.
          if printf '%s' "bad message no type" | npx --no-install commitlint --verbose; then
            echo "::error::commitlint accepted a non-conventional message — gate is fail-open"
            exit 1
          fi
          # Must pass: conventional message.
          printf '%s' "feat: self check" | npx --no-install commitlint --verbose

      # step ① — base ref resolution is blocking: a missing base ref must fail
      # loudly rather than let the range check pass vacuously (§5.1, R-6).
      - name: Resolve base ref
        id: base
        run: |
          set -euo pipefail
          BASE_REF="${{ github.base_ref }}"
          if [ -z "$BASE_REF" ]; then
            echo "::error::base ref is empty (github.base_ref unset) — cannot scope commit range"
            exit 1
          fi
          if ! git rev-parse --verify --quiet "origin/$BASE_REF"; then
            echo "::error::base ref origin/$BASE_REF not found — is fetch-depth: 0 set?"
            exit 1
          fi
          echo "base_ref=$BASE_REF" >> "$GITHUB_OUTPUT"

      # step ② — PR title check (BLOCKING, load-bearing). commitlint reads the
      # message from stdin; positional args are silently ignored, hence the pipe.
      # Passed via env (not interpolated) and with printf (not echo) so titles
      # containing quotes/backticks/$ or leading -n are handled safely (§5.2).
      - name: Validate PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s' "$PR_TITLE" | npx --no-install commitlint --verbose

      # step ③ — branch range check (ADVISORY). Intermediate commits are
      # discarded by squash-merge, so linting them must not block the PR.
      # If this repo ever moves to merge commits, promote this to blocking (§5.2).
      - name: Validate commit range (advisory)
        continue-on-error: true
        env:
          BASE_REF: ${{ steps.base.outputs.base_ref }}
        run: npx --no-install commitlint --from "origin/$BASE_REF" --to HEAD --verbose
