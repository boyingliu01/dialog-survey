name: Spike — Prisma 7 + PGlite

# Permanent carrier for tools/spike/prisma7-pglite-spike.mjs (design doc §4.3).
# Provides the ubuntu-latest half of the dual-platform evidence (criterion #7)
# and is reusable for future Prisma 8 / adapter upgrade checks.

on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/spike/**'
      - '.github/workflows/spike-prisma7.yml'
      - 'prisma/schema.prisma'
      - 'prisma.config.ts'
      - 'src/utils/prisma-client.ts'
      - 'src/utils/prisma-factory.ts'
      - 'package.json'
      - 'package-lock.json'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgresql://test:test@localhost:5432/dialog_survey_test
  TEST_DATABASE_URL: postgresql://test:test@localhost:5432/dialog_survey_test

jobs:
  spike:
    name: Spike criteria #0-#12 (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: dialog_survey_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run spike (#0-#12)
        run: npx tsx tools/spike/prisma7-pglite-spike.mjs --json stage0-spike-results-ubuntu.json

      - name: Upload spike results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prisma7-pglite-spike-results
          path: stage0-spike-results-ubuntu.json
          if-no-files-found: warn
