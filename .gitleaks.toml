# gitleaks configuration for dialog-survey
title = "dialog-survey gitleaks config"

# Extend default rules with project-specific rules
[extend]
useDefault = true

# Allow list - paths to exclude from scanning
[allowlist]
paths = [
  # Third-party vendor code (minified JS)
  '''public/js/.*\.min\.js''',
  # Node modules
  '''node_modules/''',
  # Test fixtures and mock data
  '''tests/.*\.test\.ts''',
  # Documentation examples (placeholders, not real secrets)
  '''docs/.*\.md''',
  # Environment template files (placeholders only)
  '''\.env\.example''',
  '''\.env\.production\.example''',
  # Generated Prisma client
  '''node_modules/\.prisma/''',
  # Stryker copies the whole working tree into .stryker-tmp/sandbox-* before
  # mutating. Those copies are gitignored, but they end up committed anyway when
  # a run happens between staging and pushing, which multiplied issue #211's two
  # real hits into nineteen identical ones. The originals are still reported.
  '''\.stryker-tmp/''',
  # detect-secrets' baseline legitimately contains every secret *pattern* it
  # found, as hashed entries plus the raw match text, so gitleaks reports 158
  # hits in it. The file is the mechanism that makes the second scanner
  # incremental; excluding it here does not weaken gitleaks, which still scans
  # every source the baseline was derived from.
  '''\.secrets\.baseline''',
]
# Issue #211: these regexes only matter for the full-history scan
# (`scripts/scan-git-history-secrets.mjs`), because a diff-scoped scan never
# reaches the older commits where they occur. Every entry was checked by hand
# against the actual matched text before being suppressed. They must live in the
# SAME `[allowlist]` table as `paths`: TOML rejects a second table with the same
# name ("table allowlist already exists").
regexes = [
  # Docs show the *shape* of a credential: '-H "X-Admin-Key: your-api-key"',
  # "DINGTALK_CLIENT_SECRET=<YOUR_CLIENT_SECRET>" and similar. Confirmed
  # placeholders, not live values.
  '''(?i)your[_-]?(api[_-]?key|secret|client[_-]?id|client[_-]?secret|agent[_-]?id)''',
  '''(?i)<YOUR_[A-Z_]+>''',
  '''(?i)\bxxx+\b''',
  '''(?i)test[-_]?(secret|api)?[-_]?key''',
  '''sk-test''',
]

# Custom project-specific rules
[[rules]]
id = "dingtalk-client-secret"
description = "DingTalk Client Secret"
regex = '''DINGTALK_CLIENT_SECRET=[A-Za-z0-9]+'''
tags = ["dingtalk", "secret"]
[rules.allowlist]
regexTarget = "line"
regexes = [
  '''DINGTALK_CLIENT_SECRET=\[REDACTED\]''',
  '''DINGTALK_CLIENT_SECRET=<.*>''',
  # Placeholder/dummy values in docs, CI workflow snippets and archived evidence
  '''DINGTALK_CLIENT_SECRET=your-dingtalk-client-secret''',
  '''DINGTALK_CLIENT_SECRET=smoke-dummy-secret''',
  '''DINGTALK_CLIENT_SECRET \|\| 'dummy-ci-client-secret' ''',
]

[[rules]]
id = "admin-api-key"
description = "Admin API Key"
regex = '''ADMIN_API_KEY=[A-Za-z0-9-]+'''
tags = ["admin", "api-key"]
[rules.allowlist]
regexTarget = "line"
regexes = [
  '''ADMIN_API_KEY=<.*>''',
  '''ADMIN_API_KEY=dev-admin-key-123''',
  # Placeholder value used in .env templates and archived docs
  '''ADMIN_API_KEY=your-admin-api-key''',
]

[[rules]]
id = "volcengine-api-key"
description = "Volcengine/Whalecloud API Key"
regex = '''VOLCENGINE_API_KEY=[A-Za-z0-9_+/-]+'''
tags = ["llm", "api-key"]
[rules.allowlist]
regexTarget = "line"
regexes = [
  '''VOLCENGINE_API_KEY=<.*>''',
]

# probe
