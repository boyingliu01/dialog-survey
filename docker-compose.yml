# Docker Compose deployment.
#
# No top-level `version:` key: Compose v2 ignores it and warns that it is
# obsolete on every invocation (issue #215).
#
# `$` ESCAPING — READ THIS BEFORE EDITING .env (issue #214):
# compose interpolates variables in `env_file` values. A bcrypt hash looks like
#   $2b$12$<22-char salt><31-char digest>
# and compose reads `$2b` and `$12` as (undefined) variables, replacing them
# with the empty string. The container then receives a truncated hash that can
# never match, so the admin login returns 401 for a password that is correct.
# In .env every `$` of the hash must be doubled:
#   ADMIN_PASSWORD_HASH=$$2b$$12$$<salt><digest>
# `.env.example` carries the same note. The app now refuses to treat a malformed
# hash as "wrong password" (500 + an explicit message instead of a silent 401).

services:
  postgres:
    image: postgres:16-alpine
    container_name: dialog-survey-db
    # Fail fast when the password is missing instead of silently using a weak
    # default that the whole LAN can reach (issue #215).
    environment:
      POSTGRES_USER: dialog_survey
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required - set it in .env before starting}
      POSTGRES_DB: dialog_survey
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # NOT published to the host: the app reaches it over the compose network as
    # `postgres:5432`, so a host mapping only collides with a PostgreSQL already
    # listening on 5432 and exposes the database to the LAN (issue #215).
    #
    # Need psql/Adminer from the host? Do not edit this file - add an override:
    #   # docker-compose.override.yml
    #   services:
    #     postgres:
    #       ports: !override
    #         - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    # `!override` is required: the default merge semantics APPEND to `ports`,
    # and the duplicate mapping fails with a confusing error.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dialog_survey -d dialog_survey"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dialog-survey-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://dialog_survey:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required - set it in .env before starting}@postgres:5432/dialog_survey
      PORT: 3001
      HOST: 0.0.0.0
      # Stated explicitly so it is part of the configuration surface rather than
      # an implicit default in ExportService (issue #216). Backed by a named
      # volume, so exported reports survive `up --build`, image upgrades and
      # `docker compose down` — the reports ARE the deliverable of this product.
      REPORTS_DIR: /app/reports
    env_file:
      - .env
    ports:
      - "3001:3001"
    volumes:
      # Named volume, not a bind mount: dockerd creates it owned by the image's
      # runtime user (uid 1001 `nodejs`), so reports are writable without the
      # `user: "1000:1000"` workaround a bind mount of a host directory (usually
      # uid 1000) requires (issue #216). Back this up together with
      # postgres_data — see DEPLOY.md.
      - reports_data:/app/reports
    healthcheck:
      # /health/ready, not /health: /health reports 200 for `degraded` as a
      # liveness probe, so with an unset LLM key or placeholder DingTalk
      # credentials a container that can never hold an interview used to show
      # `healthy` (issue #218). Readiness is 200 only when every dependency
      # works. The body is parsed as well, so a future route change that
      # forgets the status code still cannot make a broken deployment green.
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3001/health/ready').then(async (r) => { const body = await r.json().catch(() => ({})); process.exit(r.ok && body.status === 'healthy' ? 0 : 1); }).catch(() => process.exit(1))"
      interval: 30s
      timeout: 10s
      retries: 3
      # The first readiness probe runs the LLM reachability check, which has a
      # 30s timeout of its own; a start_period shorter than that marks a healthy
      # deployment unhealthy on its very first check.
      start_period: 60s
    restart: unless-stopped

volumes:
  postgres_data:
  reports_data:
